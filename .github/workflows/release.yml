name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
        exclude:
          - os: windows
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          BIN_NAME="arcup_${GOOS}_${GOARCH}"
          [ "$GOOS" = "windows" ] && BIN_NAME="${BIN_NAME}.exe"
          go build -ldflags="-s -w" -o "dist/$BIN_NAME" .
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
